name: Deploy Hugo to GitHub Pages

on:
  # 👉 修改1：同时监听master和main分支（适配不同命名习惯）
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # 👉 核心新增：添加 environment 配置（解决 400 错误的关键）
    environment:
      name: github-pages  # 名称必须是 github-pages，固定值
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.153.3"
          extended: true
      
      - name: Build Hugo site
        run: hugo --minify --baseURL "https://tommyzz8888.github.io/feel-soul-mylife/"
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4