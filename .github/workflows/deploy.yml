name: Deploy Hugo to GitHub Pages

on:
  # 👉 修改1：同时监听master和main分支（适配不同命名习惯）
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.153.3"
          extended: true
      
      # 👉 修改2：修正baseURL（匹配你的实际站点地址）
      - name: Build Hugo site
        run: hugo --minify --baseURL "https://tommyzz8888.github.io/feel-soul-my-life/"
      
      # 👉 修改3：新增Pages准备步骤（新版必需）
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      # 👉 修改4：新增上传构建产物步骤
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      
      # 👉 修改5：新增正式部署步骤（激活GitHub Pages）
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4