# 基础配置
baseURL: "http://localhost:1313/"  # 本地预览用这个地址
languageCode: "zh-CN"
title: "My Hugo Blog"
theme: "stack"  # 必须指定使用stack主题，这是最容易漏的！

# Stack 主题核心配置
params:
  mainSections: ["posts"]  # 指定文章存放的目录为posts
  rssFullContent: true

  # 导航菜单（确保首页/文章页路由正确）
  menu:
    main:
      - identifier: "home"
        name: "首页"
        url: "/"
        weight: 10
      - identifier: "posts"
        name: "文章"
        url: "/posts/"
        weight: 20

# 确保启用permalinks（可选，但避免路由问题）
permalinks:
  posts: "/posts/:slug/"